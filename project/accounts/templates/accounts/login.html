{% extends 'portfoliopessoal/base.html' %}
{% block content %}
<div style="padding-top: 60px; animation: fadeInUp 0.8s ease-out; max-width: 460px; margin: 0 auto;">

    <!-- HEADER -->
    <div style="text-align: center; margin-bottom: 36px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), var(--purple)); border-radius: 20px; font-size: 1.8rem; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(59,130,246,0.3);">
            🔐
        </div>
        <h2 class="hero-subtitle" style="margin: 0 0 8px 0; font-size: 2.2rem;">Entrar <span>na Conta</span></h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Acesso reservado ao gestor do portfolio.</p>
    </div>

    <!-- CARD -->
    <div style="background: rgba(15,23,42,0.8); border: 1px solid rgba(59,130,246,0.15); border-radius: 28px; padding: 40px; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.4);">

        {% if erro %}
        <div style="background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 14px 18px; margin-bottom: 28px; color: #ef4444; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
            ⚠️ {{ erro }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- USERNAME -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px;">Username</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none;">👤</span>
                    <input type="text" name="username" required placeholder="O teu username"
                           style="padding-left: 44px !important; width: 100% !important; box-sizing: border-box !important; background: rgba(2,6,23,0.6) !important; border: 1px solid rgba(255,255,255,0.08) !important; color: white !important; padding-top: 14px !important; padding-bottom: 14px !important; border-radius: 14px !important; font-size: 0.95rem !important; transition: all 0.2s !important;"
                           onfocus="this.style.borderColor='rgba(59,130,246,0.5)'; this.style.boxShadow='0 0 0 3px rgba(59,130,246,0.1)'"
                           onblur="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.boxShadow='none'">
                </div>
            </div>

            <!-- PASSWORD -->
            <div style="margin-bottom: 28px;">
                <label style="display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px;">Password</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none;">🔑</span>
                    <input type="password" name="password" id="password-input" required placeholder="A tua password"
                           style="padding-left: 44px !important; padding-right: 50px !important; width: 100% !important; box-sizing: border-box !important; background: rgba(2,6,23,0.6) !important; border: 1px solid rgba(255,255,255,0.08) !important; color: white !important; padding-top: 14px !important; padding-bottom: 14px !important; border-radius: 14px !important; font-size: 0.95rem !important; transition: all 0.2s !important;"
                           onfocus="this.style.borderColor='rgba(59,130,246,0.5)'; this.style.boxShadow='0 0 0 3px rgba(59,130,246,0.1)'"
                           onblur="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.boxShadow='none'">
                    <button type="button" onclick="togglePassword()" id="toggle-pw"
                            style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px; opacity: 0.5; transition: opacity 0.2s;"
                            onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">
                        👁
                    </button>
                </div>
            </div>

            <!-- BOTÕES -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                <a href="{% url 'registo' %}"
                   style="color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 0.88rem; transition: color 0.2s;"
                   onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-muted)'">
                    Criar conta →
                </a>
                <button type="submit" class="btn-save-main" style="padding: 14px 32px; font-size: 0.9rem;">
                    Entrar →
                </button>
            </div>
        </form>

        <!-- DIVISOR -->
        <div style="display: flex; align-items: center; gap: 14px; margin: 28px 0;">
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
            <span style="color: var(--text-muted); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">ou</span>
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
        </div>

        <!-- LINK MÁGICO -->
        <a href="{% url 'magic_link' %}"
           style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; box-sizing: border-box; padding: 14px 24px; background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.25); border-radius: 14px; color: var(--purple); font-weight: 700; font-size: 0.9rem; text-decoration: none; transition: all 0.25s;"
           onmouseover="this.style.background='rgba(168,85,247,0.15)'; this.style.borderColor='rgba(168,85,247,0.5)'; this.style.transform='translateY(-1px)'"
           onmouseout="this.style.background='rgba(168,85,247,0.08)'; this.style.borderColor='rgba(168,85,247,0.25)'; this.style.transform='translateY(0)'">
            ✉️ Entrar com Link Mágico
        </a>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('password-input');
    const btn = document.getElementById('toggle-pw');
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>
{% endblock %}
