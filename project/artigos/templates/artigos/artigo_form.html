{% extends 'portfoliopessoal/base.html' %}
{% block content %}
<div style="padding-top: 40px; animation: fadeInUp 0.8s ease-out;">

    <a href="{% url 'lista_artigos' %}" class="btn-back">← Voltar aos Artigos</a>

    <div style="text-align: center; margin-bottom: 40px;">
        <h2 class="hero-subtitle" style="margin-bottom: 10px;">{{ titulo }}</h2>
    </div>

    <div class="glass-form-container">
        <form method="POST" enctype="multipart/form-data" class="styled-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-field-group">
                <label>{{ field.label }}</label>
                <div class="field-container">
                    {{ field }}
                </div>
                {% if field.errors %}
                <span style="color: #ef4444; font-size: 0.8rem;">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
            {% endfor %}
            <div class="form-footer">
                <a href="{% url 'lista_artigos' %}" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-save-main">Guardar →</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
